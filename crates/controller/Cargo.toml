[package]
name = "recognito-controller"
description = "Reconciles CognitoClientMapping resources into Cognito app clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
recognito-api.workspace = true

anyhow.workspace = true
axum.workspace = true
futures.workspace = true
sha2.workspace = true
aws-config.workspace = true
aws-sdk-cognitoidentityprovider.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-types.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "recognito-controller"
path = "src/main.rs"

[[bin]]
name = "recognito-crdgen"
path = "src/bin/crdgen.rs"
