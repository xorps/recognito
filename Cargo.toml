[workspace]
resolver = "2"
members = ["api", "cache", "broker", "controller"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"

# `cache` is a path dependency from day one so that extracting it into its own
# repo stays a one-line change (see CLAUDE.md: "split later if the cache crate
# is extracted"). Nothing in `cache` may depend on `api`, kube, or aws-sdk —
# the credential fetcher is injected as a trait.
[workspace.dependencies]
recognito-api = { path = "api" }
recognito-cache = { path = "cache" }

anyhow = "1.0.104"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "form", "tokio"] }
dashmap = "6.2.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["use_pem"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
rand = "0.9.2"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
