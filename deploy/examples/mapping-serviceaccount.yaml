apiVersion: recognito.io/v1alpha1
kind: CognitoClientMapping
metadata:
  name: payments-api
  namespace: payments
spec:
  # Resolved in this mapping's namespace only; there is no namespace field.
  serviceAccountRef:
    name: payments-api
  userPoolId: us-east-1_EXAMPLE
  allowedScopes:
    - name: read
      scopes: [payments/read]
    - name: write
      scopes: [payments/read, payments/write]
  tokenValidity: 15m
  rotateAfter: 2160h
---
apiVersion: v1
kind: Pod
metadata:
  name: payments-api
  namespace: payments
spec:
  serviceAccountName: payments-api
  # The default apiserver-audience token is rejected by the broker; only the
  # projected token below is usable, so the default mount is unnecessary.
  automountServiceAccountToken: false
  containers:
    - name: app
      image: REPLACE_WITH_APP_IMAGE
      volumeMounts:
        - name: recognito-token
          mountPath: /var/run/secrets/recognito
          readOnly: true
  volumes:
    - name: recognito-token
      projected:
        sources:
          - serviceAccountToken:
              # Must match the broker's RECOGNITO_BROKER_AUDIENCE byte-for-byte.
              audience: https://cognito-broker.REPLACE_WITH_DOMAIN
              expirationSeconds: 3600
              path: broker-token
