apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recognito-broker
rules:
  - apiGroups: ["recognito.io"]
    resources: ["cognitoclientmappings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: recognito-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: recognito-broker
subjects:
  - kind: ServiceAccount
    name: recognito-broker
    namespace: recognito-system
